<div class="Dashboard">
  <div class="heading">
    <h4>Dashboard</h4>
    <div class="underline"></div>
    <p class="welcome">Welcome back{{ (userName | async) ? ', ' + (userName | async) : '' }}.</p>
  </div>

  <section class="apps-grid">
    <a class="app-card" routerLink="/dashboard/economic">
      <div class="app-icon"><i class="fas fa-wallet"></i></div>
      <div class="app-name">E-conomic</div>

      </p>

  </section>
