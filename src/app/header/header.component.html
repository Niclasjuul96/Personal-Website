<div class="Header-container">
  <div class="logo" (click)="handleLogoClick()">
    <img src="../../assets/logo.png" id="logo" alt="Logo" />
  </div>
  <div class="menu-icon" (click)="handleMenuClick()">
    <i [class]="isMenuOpen ? 'fas fa-times' : 'fas fa-bars'"></i>
  </div>
  <nav [class]="isMenuOpen ? 'navbar active' : 'navbar'">
    <ul id="navbar">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="handleNavLinkClick()">Home</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="active" (click)="handleNavLinkClick()">About</a>
      </li>
      <li>
        <a routerLink="/portfolio" routerLinkActive="active" (click)="handleNavLinkClick()">Portfolio</a>
      </li>
      <li>
        <a routerLink="/cv" routerLinkActive="active" (click)="handleNavLinkClick()">CV</a>
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="active" (click)="handleNavLinkClick()">Contact</a>
      </li>
      @if (isAllowed | async) {
        <li>
          <a routerLink="/dashboard" routerLinkActive="active" (click)="handleNavLinkClick()">Dashboard</a>
        </li>
      }
    </ul>
  </nav>
  <div class="auth-area">
    @if (isAuthenticated | async) {
      <div class="user-badge">
        @if (userPicture | async; as picture) {
          <img [src]="picture" alt="Profile" class="user-avatar" />
        }
        <span class="user-name">{{ userName | async }}</span>
        @if (isAllowed | async) {
          <span
            class="access-badge"
            title="This account has access to private tools on this site, like the Dashboard."
          >Access granted</span>
        } @else {
          <span
            class="no-access-badge"
            title="This login unlocks private tools (like a personal dashboard) for select accounts. This account isn't one of them, but thanks for signing in!"
          >No access</span>
        }
        <button class="btn logout-btn" (click)="handleLogoutClick()">
          <i class="fas fa-sign-out-alt"></i>
          <span class="btn-text">Log out</span>
        </button>
      </div>
    } @else {
      <button class="btn login-btn" (click)="handleLoginClick()">
        <i class="fab fa-google"></i>
        <span class="btn-text">Sign in with Google</span>
      </button>
    }
  </div>
</div>
